name: 2 - Compiler APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'test/**'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generer les fichiers Android si absents
        run: |
          flutter create --platforms=android --project-name suivi --org fr.chuppito .
      - name: Installer icone personnalisee
        run: |
          sed -i 's|@mipmap/ic_launcher|@drawable/suivi_icon|g' android/app/src/main/AndroidManifest.xml
      - name: Autoriser camera et internet
        run: |
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
      - name: Installer dependances
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Compiler APK
        run: flutter build apk --release
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: suivi-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
